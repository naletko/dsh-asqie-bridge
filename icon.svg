<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Time Asqie Bridge">
  <!--
    Remote control for this DeepSeek Harness: a phone holding a terminal prompt,
    flanked by link waves. Same blue tile family as the other DSH plugins, with
    a single teal accent borrowed from Time Asqie. Shapes are solid so the mark
    survives the 28px plugin card.
  -->
  <defs>
    <linearGradient id="asqie-tile" x1="8" y1="5" x2="56" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fa3ff" />
      <stop offset=".55" stop-color="#4f6ae8" />
      <stop offset="1" stop-color="#3c4cd0" />
    </linearGradient>
    <radialGradient id="asqie-glow" cx="20" cy="12" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28" />
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".05" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#asqie-tile)" />
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#asqie-glow)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity=".24" />

  <rect x="21.5" y="12.5" width="21" height="39" rx="7" fill="#ffffff" />
  <rect x="25.5" y="17.5" width="13" height="25" rx="3" fill="#3346c4" />
  <path d="M29 24.5l5 4.5-5 4.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M29 36.5h5" stroke="#86f0de" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="46.5" r="1.7" fill="#3346c4" />

  <path d="M15.5 27.5c-3.6 2.8-3.6 8.2 0 11M48.5 27.5c3.6 2.8 3.6 8.2 0 11" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" opacity=".92" />
  <circle cx="49.5" cy="14.5" r="3.1" fill="#86f0de" />
  <circle cx="49.5" cy="14.5" r="1.1" fill="#ffffff" fill-opacity=".75" />
</svg>
